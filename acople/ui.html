<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acople Terminal</title>
<style>
:root {
  --bg:        #282a36;
  --bg-alt:    #1e2029;
  --surface:   #303343;
  --surface2:  #383b4d;
  --border:    #44475a;
  --comment:   #6272a4;
  --fg:        #f8f8f2;
  --fg-dim:    #c0c4d8;
  --cyan:      #8be9fd;
  --green:     #50fa7b;
  --orange:    #ffb86c;
  --pink:      #ff79c6;
  --purple:    #bd93f9;
  --red:       #ff5555;
  --yellow:    #f1fa8c;
  --font: 'JetBrains Mono', 'IBM Plex Mono', 'Cascadia Code', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--comment); }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 12px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Topbar ── */
.topbar {
  height: 28px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 12px;
}
.topbar-logo {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--purple);
  text-transform: uppercase;
}
.topbar-sep { color: var(--border); font-size: 10px; }
.topbar-item { font-size: 10px; color: var(--comment); display: flex; align-items: center; gap: 4px; }
.topbar-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--red);
}
.topbar-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
.topbar-val { color: var(--fg-dim); font-weight: 600; }

/* ── Layout ── */
.container {
  display: flex;
  height: calc(100vh - 28px);
}
.sidebar {
  width: 280px;
  min-width: 280px;
  border-right: 1px solid var(--border);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
  background: var(--bg);
}
.main {
  flex: 1;
  padding: 6px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Box / Panel ── */
.box {
  border: 1px solid var(--border);
  position: relative;
  background: var(--bg);
}
.box-title {
  position: absolute; top: -1px; left: 8px;
  background: var(--bg);
  padding: 0 4px;
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--comment);
}
.box-title.accent { color: var(--purple); }
.box-title.cyan { color: var(--cyan); }
.box-title.green { color: var(--green); }
.box-title.pink { color: var(--pink); }
.box-body { padding: 8px 6px; }

/* ── Status rows ── */
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  font-size: 10px;
  border-bottom: 1px solid rgba(68,71,90,0.3);
}
.stat-row:last-child { border-bottom: none; }
.stat-label { color: var(--comment); }
.stat-val { color: var(--fg-dim); font-weight: 600; }

/* ── Tabs ── */
.tab-bar {
  display: flex;
  height: 22px;
  border-bottom: 1px solid var(--border);
}
.tab-btn {
  font-family: var(--font);
  font-size: 10px;
  padding: 0 10px;
  background: var(--bg-alt);
  border: none;
  border-right: 1px solid var(--border);
  color: var(--comment);
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: background 0.1s, color 0.1s;
}
.tab-btn:hover { color: var(--fg-dim); }
.tab-btn.active {
  background: var(--surface);
  color: var(--fg);
  border-bottom: 2px solid var(--purple);
}
.tab-content { display: none; flex-direction: column; flex: 1; }
.tab-content.active { display: flex; }

/* ── Messages area ── */
.messages {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 6px 8px;
  overflow-y: auto;
  font-size: 11px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 100px;
}
.token { color: var(--fg); }
.token.system { color: var(--comment); font-style: italic; }
.token.error { color: var(--red); }
.event-label { color: var(--purple); font-weight: 700; font-size: 10px; }
.event-tool { color: var(--cyan); font-weight: 600; }

/* ── Buttons ── */
.btn {
  font-family: var(--font); font-size: 10px;
  padding: 2px 7px; border: 1px solid var(--border);
  background: transparent; color: var(--fg-dim);
  cursor: pointer; border-radius: 2px;
  transition: border-color 0.1s, color 0.1s, background 0.1s;
}
.btn:hover { border-color: var(--purple); color: var(--purple); }
.btn-primary {
  border-color: var(--purple); color: var(--purple);
  background: rgba(189,147,249,0.1);
}
.btn-primary:hover { background: rgba(189,147,249,0.22); }
.btn-danger { border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: rgba(255,85,85,0.15); }
.btn-ghost { border: none; color: var(--comment); }
.btn-ghost:hover { color: var(--fg-dim); }
.btn:disabled {
  opacity: 0.4; cursor: default;
  border-color: var(--border); color: var(--comment);
}
.btn-group { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }

/* ── Inputs ── */
.input {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--fg); font-family: var(--font); font-size: 11px;
  padding: 3px 7px; border-radius: 2px; outline: none; width: 100%;
}
.input:focus { border-color: var(--purple); }
.input::placeholder { color: var(--comment); }
textarea.input { resize: vertical; min-height: 52px; line-height: 1.4; }
select.input { font-size: 10px; color: var(--fg-dim); cursor: pointer; }
select.input option { background: var(--bg); color: var(--fg); }

/* ── Input groups ── */
.field { display: flex; flex-direction: column; gap: 2px; }
.field label { font-size: 9px; color: var(--comment); text-transform: uppercase; letter-spacing: 0.08em; }
.field-row { display: flex; gap: 4px; }

/* ── Image Gallery ── */
.image-gallery {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 4px;
  padding: 4px;
  overflow-y: auto;
  border: 1px solid var(--border);
  min-height: 100px;
}
.image-card {
  border: 1px solid var(--border);
  overflow: hidden;
  background: var(--bg-alt);
}
.image-card img { width: 100%; display: block; }
.image-actions {
  padding: 3px 5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  color: var(--comment);
  border-top: 1px solid var(--border);
}
.image-actions a { color: var(--cyan); text-decoration: none; }
.image-actions a:hover { text-decoration: underline; }
.image-loading {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  color: var(--comment);
  font-size: 11px;
  gap: 6px;
}
.spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Helpers ── */
.mt-2 { margin-top: 2px; }
.mt-4 { margin-top: 4px; }
.grow { flex: 1; }
.flex-col { display: flex; flex-direction: column; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">◆ Acople</span>
  <span class="topbar-sep">|</span>
  <span class="topbar-item">
    <span class="topbar-dot" id="status-dot"></span>
    <span id="status-text">Offline</span>
  </span>
  <span class="topbar-sep">|</span>
  <span class="topbar-item">Agent: <span class="topbar-val" id="info-agent">—</span></span>
  <span class="topbar-item">Image: <span class="topbar-val" id="info-image">—</span></span>
  <span style="flex:1"></span>
  <span class="topbar-item" style="font-size:9px;color:var(--border)">v1.3.0</span>
</div>

<div class="container">

<div class="sidebar">
  <div class="box">
    <div class="box-title accent">Server</div>
    <div class="box-body">
      <div class="field">
        <label>URL</label>
        <input class="input" type="text" id="server-url" value="http://localhost:47334">
      </div>
      <div class="field mt-2">
        <label>API Key</label>
        <input class="input" type="password" id="api-key" placeholder="Optional">
      </div>
      <div class="btn-group" style="margin-top:6px">
        <button class="btn btn-primary" id="connect-btn">Connect</button>
        <button class="btn" id="diagnostics-btn">Diagnose</button>
      </div>
    </div>
  </div>

  <div class="box">
    <div class="box-title">Status</div>
    <div class="box-body">
      <div class="stat-row"><span class="stat-label">Agent</span><span class="stat-val" id="si-agent">—</span></div>
      <div class="stat-row"><span class="stat-label">Image Gen</span><span class="stat-val" id="si-image">—</span></div>
      <div class="stat-row"><span class="stat-label">OpenAI GW</span><span class="stat-val" id="si-openai">—</span></div>
    </div>
  </div>

  <div class="box" style="flex:1">
    <div class="box-title cyan">Endpoints</div>
    <div class="box-body" style="font-size:9px;color:var(--comment);padding:6px">
      <div style="padding:2px 0"><span style="color:var(--purple);font-weight:700">GET</span> /health</div>
      <div style="padding:2px 0"><span style="color:var(--purple);font-weight:700">GET</span> /agents</div>
      <div style="padding:2px 0"><span style="color:var(--purple);font-weight:700">GET</span> /models</div>
      <div style="padding:2px 0"><span style="color:var(--purple);font-weight:700">GET</span> /diagnose</div>
      <div style="padding:2px 0"><span style="color:var(--green);font-weight:700">POST</span> /chat</div>
      <div style="padding:2px 0"><span style="color:var(--green);font-weight:700">POST</span> /chat/simple</div>
      <div style="padding:2px 0"><span style="color:var(--green);font-weight:700">POST</span> /interrupt</div>
      <div style="padding:2px 0"><span style="color:var(--green);font-weight:700">POST</span> /image/generate</div>
      <div style="margin-top:4px;padding-top:4px;border-top:1px solid var(--border)"><span style="color:var(--orange);font-weight:700">POST</span> /v1/chat/completions</div>
      <div style="padding:2px 0"><span style="color:var(--purple);font-weight:700">GET</span> /v1/models</div>
    </div>
  </div>
</div>

<div class="main">
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="chat">◆ Chat</button>
    <button class="tab-btn" data-tab="image">◈ Image</button>
  </div>

  <div class="tab-content active flex-col grow" id="tab-chat">
    <div class="messages" id="messages"></div>
    <div class="field mt-2">
      <div class="field-row">
        <div style="flex:1" class="field">
          <label>Agent</label>
          <select class="input" id="agent-select">
            <option value="">Default</option>
          </select>
        </div>
        <div style="flex:1" class="field">
          <label>Endpoint</label>
          <select class="input" id="endpoint-select">
            <option value="/chat">/chat</option>
            <option value="/chat/simple">/chat/simple</option>
          </select>
        </div>
      </div>
    </div>
    <div class="field mt-2">
      <label>System</label>
      <input class="input" type="text" id="system-prompt" placeholder="Optional system prompt...">
    </div>
    <div class="field mt-2">
      <label>Prompt</label>
      <textarea class="input" id="prompt-input" placeholder="Type your prompt (Ctrl+Enter to send)" rows="2"></textarea>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="send-btn">Send</button>
      <button class="btn btn-danger" id="interrupt-btn">Kill</button>
      <button class="btn btn-ghost" id="clear-btn">Clear</button>
    </div>
  </div>

  <div class="tab-content flex-col grow" id="tab-image">
    <div class="image-gallery" id="image-gallery">
      <div class="image-loading" style="border:none;color:var(--comment)">Enter a prompt and generate</div>
    </div>
    <div class="field-row mt-2">
      <div class="field" style="flex:1">
        <label>Size</label>
        <select class="input" id="img-size">
          <option value="auto">Auto</option>
          <option value="1024x1024">1024×1024</option>
          <option value="1536x1024">1536×1024</option>
          <option value="1024x1536">1024×1536</option>
        </select>
      </div>
      <div class="field" style="flex:1">
        <label>Quality</label>
        <select class="input" id="img-quality">
          <option value="auto">Auto</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="field" style="flex:0 0 60px">
        <label>Count</label>
        <input class="input" type="number" id="img-n" value="1" min="1" max="10">
      </div>
    </div>
    <div class="field mt-2">
      <label>Prompt</label>
      <textarea class="input" id="img-prompt" placeholder="Describe the image..." rows="2"></textarea>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="img-generate-btn">Generate</button>
      <button class="btn btn-ghost" id="img-clear-btn">Clear All</button>
    </div>
  </div>
</div>

</div>

<script>
const s = {
  controller: null,
  generating: false,
  currentAgent: null,
};

const $ = (id) => document.getElementById(id);

function url(path) {
  return $('server-url').value.replace(/\/+$/, '') + path;
}
function headers() {
  const h = { 'Content-Type': 'application/json' };
  const k = $('api-key').value.trim();
  if (k) h['X-API-Key'] = k;
  return h;
}

// ── Render ──

function msg(text, type = 'token') {
  const m = $('messages');
  const el = document.createElement('span');
  el.className = 'token ' + type;
  if (type === 'event') {
    el.innerHTML = '\n<span class="event-label">[' + text + ']</span> ';
  } else if (type === 'tool') {
    el.innerHTML = '\n<span class="event-tool">TOOL:</span> ' + text;
  } else {
    el.textContent = text;
  }
  m.appendChild(el);
  m.scrollTop = m.scrollHeight;
}

function renderStatus(data) {
  const online = $('status-dot').classList.contains('online');
  $('si-agent').textContent = data.agent || 'None';
  $('si-agent').style.color = data.agent ? 'var(--green)' : 'var(--comment)';
  $('si-image').textContent = data.image_ready ? 'Ready' : 'No Key';
  $('si-image').style.color = data.image_ready ? 'var(--green)' : 'var(--comment)';
  $('si-openai').textContent = 'Active';
  $('si-openai').style.color = 'var(--green)';
}

// ── Connection ──

async function checkConnection() {
  try {
    const res = await fetch(url('/health'), { headers: headers() });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    $('status-dot').classList.add('online');
    $('status-text').textContent = 'Online';
    $('status-text').style.color = 'var(--green)';
    $('info-agent').textContent = data.agent || 'None';
    $('info-image').textContent = data.image_ready ? 'Ready' : 'No Key';
    s.currentAgent = data.agent;
    renderStatus(data);
    loadAgents();
    msg('\n[connected] ' + url('/health') + '\n', 'system');
  } catch (e) {
    $('status-dot').classList.remove('online');
    $('status-text').textContent = 'Offline';
    $('status-text').style.color = 'var(--red)';
    $('info-agent').textContent = '—';
    $('info-image').textContent = '—';
    msg('\n[error] ' + e.message + '\n', 'error');
  }
}

async function loadAgents() {
  try {
    const res = await fetch(url('/agents'), { headers: headers() });
    if (!res.ok) return;
    const data = await res.json();
    const sel = $('agent-select');
    sel.innerHTML = '<option value="">Default</option>';
    for (const [name, avail] of Object.entries(data.agents)) {
      if (avail) { const o = document.createElement('option'); o.value = name; o.textContent = name; sel.appendChild(o); }
    }
  } catch (e) { /* ignore */ }
}

async function runDiagnostics() {
  msg('\n[diagnose] ' + url('/diagnose') + '\n', 'system');
  try {
    const res = await fetch(url('/diagnose'), { headers: headers() });
    const data = await res.json();
    msg(JSON.stringify(data, null, 2) + '\n', 'system');
  } catch (e) {
    msg('[error] ' + e.message + '\n', 'error');
  }
}

// ── Chat ──

async function sendPrompt() {
  const prompt = $('prompt-input').value.trim();
  if (!prompt) return;
  if (s.generating) { msg('\n[busy] already generating\n', 'system'); return; }

  const endpoint = $('endpoint-select').value;
  const payload = { prompt };
  const sa = $('agent-select').value;
  if (sa) payload.agent = sa;
  if (endpoint === '/chat') {
    const sys = $('system-prompt').value.trim();
    if (sys) payload.system = sys;
  }

  const agentLabel = sa || s.currentAgent || 'auto';

  msg('\n◈ [' + agentLabel + '] ' + endpoint + '\n', 'system');
  $('prompt-input').value = '';
  s.generating = true;
  $('send-btn').textContent = 'Running';
  $('send-btn').disabled = true;
  s.controller = new AbortController();

  try {
    const res = await fetch(url(endpoint), {
      method: 'POST', headers: headers(),
      body: JSON.stringify(payload),
      signal: s.controller.signal,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(res.status + ' ' + (err.detail || ''));
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try { handleEvent(JSON.parse(line.slice(6))); }
        catch (e) { /* skip partial */ }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') msg('\n[error] ' + e.message + '\n', 'error');
  } finally {
    s.generating = false;
    $('send-btn').textContent = 'Send';
    $('send-btn').disabled = false;
    s.controller = null;
  }
}

function handleEvent(ev) {
  switch (ev.type) {
    case 'token': if (ev.text) msg(ev.text, 'token'); break;
    case 'tool_use':
      msg('tool_use: ' + (ev.tool || '?'), 'tool');
      if (ev.input) msg('\n' + JSON.stringify(ev.input, null, 2) + '\n', 'system');
      break;
    case 'tool_result': msg('tool_result', 'event'); break;
    case 'image': addImage(ev.b64, ev.format, ev.revised_prompt, ev.index); break;
    case 'done': msg('done', 'event'); break;
    case 'error': msg('\n[error] ' + (ev.message || '?') + '\n', 'error'); break;
    case 'system': console.debug('[agent]', ev.message); break;
  }
}

// ── Image ──

function addImage(b64, fmt, revised, idx) {
  const gal = $('image-gallery');
  const ld = gal.querySelector('.image-loading');
  if (ld) ld.remove();

  const card = document.createElement('div');
  card.className = 'image-card';
  const img = document.createElement('img');
  img.src = 'data:image/' + fmt + ';base64,' + b64;
  img.alt = revised || 'gen';
  card.appendChild(img);
  const act = document.createElement('div');
  act.className = 'image-actions';
  act.innerHTML = '<span>#' + ((idx || 0) + 1) + '</span>';
  const dl = document.createElement('a');
  dl.href = img.src;
  dl.download = 'image_' + Date.now() + '_' + (idx || 0) + '.' + fmt;
  dl.textContent = '⬇';
  act.appendChild(dl);
  card.appendChild(act);
  gal.prepend(card);
}

async function generateImage() {
  const prompt = $('img-prompt').value.trim();
  if (!prompt) return;

  const gal = $('image-gallery');
  const ld = document.createElement('div');
  ld.className = 'image-loading';
  ld.innerHTML = '<div class="spinner"></div> Generating...';
  gal.prepend(ld);
  const btn = $('img-generate-btn');
  btn.textContent = 'Generating';
  btn.disabled = true;

  try {
    const res = await fetch(url('/image/generate'), {
      method: 'POST', headers: headers(),
      body: JSON.stringify({
        prompt,
        size: $('img-size').value,
        quality: $('img-quality').value,
        n: parseInt($('img-n').value) || 1,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || 'HTTP ' + res.status);
    }
    const data = await res.json();
    if (ld.parentNode) ld.remove();
    (data.images || []).forEach((img, i) => addImage(img.b64, img.format, img.revised_prompt, i));
    $('img-prompt').value = '';
  } catch (e) {
    if (ld.parentNode) ld.remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'image-loading';
    errDiv.style.color = 'var(--red)';
    errDiv.textContent = 'Error: ' + e.message;
    gal.prepend(errDiv);
  } finally {
    btn.textContent = 'Generate';
    btn.disabled = false;
  }
}

async function interrupt() {
  if (!s.generating) return;
  msg('\n[interrupt]\n', 'system');
  try { await fetch(url('/interrupt'), { method: 'POST', headers: headers() }); }
  catch (e) { msg('[error] ' + e.message + '\n', 'error'); }
}

// ── Events ──

document.querySelectorAll('.tab-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    $('tab-' + b.dataset.tab).classList.add('active');
  });
});

$('connect-btn').addEventListener('click', checkConnection);
$('diagnostics-btn').addEventListener('click', runDiagnostics);
$('send-btn').addEventListener('click', sendPrompt);
$('interrupt-btn').addEventListener('click', interrupt);
$('clear-btn').addEventListener('click', () => { $('messages').innerHTML = ''; });
$('prompt-input').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') sendPrompt(); });
$('endpoint-select').addEventListener('change', () => {
  const full = $('endpoint-select').value === '/chat';
  $('system-prompt').disabled = !full;
  $('system-prompt').placeholder = full ? 'Optional system prompt...' : '(chat only)';
});
$('img-generate-btn').addEventListener('click', generateImage);
$('img-clear-btn').addEventListener('click', () => { $('image-gallery').innerHTML = ''; });
$('img-prompt').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generateImage(); });
$('system-prompt').disabled = false;

setTimeout(checkConnection, 500);
</script>
</body>
</html>
